<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glucose Penguin</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #051221;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  #hud {
    position: fixed;
    left: 20px;
    top: 18px;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 0 10px rgba(0,0,0,0.6);
    user-select: none;
    pointer-events: none;
  }
  #hud .value { font-size: 34px; font-weight: 300; letter-spacing: 1px; }
  #hud .arrow { font-size: 26px; margin-left: 6px; }
  #hud .meta { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  #status {
    position: fixed;
    left: 20px;
    top: 84px;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    max-width: 260px;
  }
  #gear {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    color: rgba(255,255,255,0.8);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #gear:hover { background: rgba(255,255,255,0.2); }
  #panel {
    position: fixed;
    top: 66px;
    right: 18px;
    width: 300px;
    background: rgba(20,20,26,0.94);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 16px;
    color: rgba(255,255,255,0.88);
    z-index: 20;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #panel.open { display: block; }
  #panel label { display: block; font-size: 12px; opacity: 0.65; margin-bottom: 6px; }
  #panel input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 13px;
    margin-bottom: 12px;
  }
  #panel button {
    width: 100%;
    padding: 9px;
    border-radius: 6px;
    border: none;
    background: #3a7ac0;
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  #panel button:hover { background: #4a8ad0; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div><span class="value" id="val">--</span><span class="arrow" id="arrow"></span></div>
  <div class="meta" id="meta">connecting…</div>
</div>
<div id="status"></div>

<div id="gear" title="Settings">⚙</div>
<div id="panel">
  <label>Nightscout URL</label>
  <input id="urlInput" type="text" placeholder="https://your-name.northflank.app">
  <button id="saveBtn">Save</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hudVal = document.getElementById('val');
  const hudArrow = document.getElementById('arrow');
  const hudMeta = document.getElementById('meta');
  const statusEl = document.getElementById('status');
  const gear = document.getElementById('gear');
  const panel = document.getElementById('panel');
  const urlInput = document.getElementById('urlInput');
  const saveBtn = document.getElementById('saveBtn');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Nightscout URL handling ----
  // Baked in so the page works for anyone who opens it, with no setup.
  const DEFAULT_NS_URL = 'https://p01--nightscout--cqvfsjd8b54h.code.run';
  let nsUrl = localStorage.getItem('glucoseArtNsUrl') || DEFAULT_NS_URL;
  function openPanel() { urlInput.value = nsUrl; panel.classList.add('open'); }
  function closePanel() { panel.classList.remove('open'); }
  gear.addEventListener('click', () => panel.classList.contains('open') ? closePanel() : openPanel());
  saveBtn.addEventListener('click', () => {
    const v = urlInput.value.trim().replace(/\/+$/, '');
    if (v) {
      nsUrl = v;
      localStorage.setItem('glucoseArtNsUrl', nsUrl);
      closePanel();
      fetchLatest();
    }
  });
  if (!nsUrl) openPanel();

  // ---- Glucose bands (mmol/L) ----
  const LOW_DEEP  = 3.0;   // fully submerged, max depth
  const LOW_EDGE  = 6.0;   // waterline - bottom of target range
  const HIGH_EDGE = 8.0;   // treeline - top of target range, starts climbing
  const HIGH_CEIL = 14.0;  // full altitude

  const ARROW = {
    DoubleUp: '⇈', SingleUp: '↑', FortyFiveUp: '↗', Flat: '→',
    FortyFiveDown: '↘', SingleDown: '↓', DoubleDown: '⇊',
    NOT_COMPUTABLE: '·', RATE_OUT_OF_RANGE: '·', NONE: '·'
  };
  const TREND_BIAS = {
    DoubleUp: -1.6, SingleUp: -1.0, FortyFiveUp: -0.5, Flat: 0,
    FortyFiveDown: 0.5, SingleDown: 1.0, DoubleDown: 1.6,
  };

  let rawMmol = 6.5;
  let smoothMmol = 6.5;
  let haveData = false;
  let trendBias = 0;
  let smoothBias = 0;
  let turbulence = 0.2;

  async function fetchLatest() {
    if (!nsUrl) { statusEl.textContent = 'No Nightscout URL set — click the gear icon.'; return; }
    if (!/^https?:\/\//i.test(nsUrl)) {
      statusEl.textContent = 'URL must start with https:// — click the gear and add it.';
      return;
    }
    try {
      const res = await fetch(`${nsUrl}/api/v1/entries.json?count=12`);
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      const entries = await res.json();
      if (!entries || !entries.length) throw new Error('No entries returned');

      const latest = entries[0];
      const mgdl = latest.sgv;
      rawMmol = mgdl / 18;
      haveData = true;
      const direction = latest.direction || 'Flat';
      trendBias = TREND_BIAS[direction] ?? 0;
      const ageMin = Math.round((Date.now() - latest.date) / 60000);

      const values = entries.map(e => e.sgv).filter(v => typeof v === 'number');
      const mean = values.reduce((a, b) => a + b, 0) / values.length;
      const variance = values.reduce((a, b) => a + (b - mean) ** 2, 0) / values.length;
      turbulence = Math.min(1.6, 0.2 + Math.sqrt(variance) / 22);

      hudVal.textContent = rawMmol.toFixed(1);
      hudArrow.textContent = ARROW[direction] || '';
      hudMeta.textContent = ageMin <= 1 ? 'just now' : `${ageMin} min ago`;
      statusEl.textContent = '';
    } catch (err) {
      statusEl.textContent = 'Nightscout error: ' + (err && err.message ? err.message : String(err));
      console.error('[glucose-art] fetch failed:', err);
    }
  }
  fetchLatest();
  setInterval(fetchLatest, 60000);

  // ---- vertical mapping ----
  const GROUND_FRAC = 0.62;
  const SKY_TOP_FRAC = 0.10;
  const DEEP_FRAC = 0.92;

  function yFracForMmol(mmol) {
    if (mmol <= LOW_EDGE) {
      const t = Math.max(0, Math.min(1, (LOW_EDGE - mmol) / (LOW_EDGE - LOW_DEEP)));
      return GROUND_FRAC + t * (DEEP_FRAC - GROUND_FRAC);
    } else if (mmol < HIGH_EDGE) {
      return GROUND_FRAC;
    } else {
      const t = Math.max(0, Math.min(1, (mmol - HIGH_EDGE) / (HIGH_CEIL - HIGH_EDGE)));
      return GROUND_FRAC - t * (GROUND_FRAC - SKY_TOP_FRAC);
    }
  }

  // ---- ambient decoration ----
  const icebergs = Array.from({length: 6}, (_, i) => ({
    x: Math.random(), scale: 0.6 + Math.random() * 1.1,
    speed: 0.0015 + Math.random() * 0.0025, jag: Math.random() * 100
  }));
  let iglooX = 0.14; // scrolls along with the icebergs to sell forward motion
  const fish = Array.from({length: 4}, (_, i) => ({
    x: Math.random(), y: 0.72 + Math.random() * 0.22,
    scale: 0.6 + Math.random() * 0.6, speed: (0.03 + Math.random() * 0.05) * (Math.random() < 0.5 ? 1 : -1)
  }));
  let ambientBubbles = [];
  let penguinBubbles = [];
  const snow = Array.from({length: 40}, () => ({
    x: Math.random(), y: Math.random(),
    r: 1 + Math.random() * 2, drift: (Math.random() - 0.5) * 0.02,
    speed: 0.02 + Math.random() * 0.03
  }));

  function drawIceberg(x, baseY, scale, jag) {
    // soft, lumpy glacier mound rather than a sharp mountain peak
    const w = 75 * scale, h = 60 * scale * (0.8 + 0.3 * Math.sin(jag));
    ctx.save();
    ctx.translate(x, baseY);
    ctx.fillStyle = '#eef7fb';
    ctx.beginPath();
    ctx.moveTo(-w * 0.5, 0);
    ctx.bezierCurveTo(-w * 0.5, -h * 0.5, -w * 0.32, -h * 0.7, -w * 0.15, -h * 0.6);
    ctx.bezierCurveTo(-w * 0.05, -h * 0.95, w * 0.12, -h, w * 0.2, -h * 0.72);
    ctx.bezierCurveTo(w * 0.35, -h * 0.8, w * 0.5, -h * 0.5, w * 0.5, 0);
    ctx.closePath();
    ctx.fill();
    // shadow facet for a bit of dimension
    ctx.fillStyle = 'rgba(150,190,215,0.3)';
    ctx.beginPath();
    ctx.moveTo(w * 0.2, -h * 0.72);
    ctx.bezierCurveTo(w * 0.35, -h * 0.8, w * 0.5, -h * 0.5, w * 0.5, 0);
    ctx.lineTo(w * 0.1, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawIgloo(x, baseY, scale) {
    ctx.save();
    ctx.translate(x, baseY);
    ctx.fillStyle = '#f2f8fb';
    ctx.beginPath();
    ctx.arc(0, 0, 46 * scale, Math.PI, 0);
    ctx.fill();
    // subtle brick-course lines
    ctx.strokeStyle = 'rgba(160,195,215,0.5)';
    ctx.lineWidth = 1.5 * scale;
    for (let r = 14; r < 44; r += 12) {
      ctx.beginPath();
      ctx.arc(0, 0, r * scale, Math.PI, 0);
      ctx.stroke();
    }
    // doorway tunnel - fully above ground level, arched top
    ctx.fillStyle = '#2a3540';
    ctx.beginPath();
    ctx.ellipse(26 * scale, -14 * scale, 10 * scale, 14 * scale, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(16 * scale, -14 * scale, 20 * scale, 14 * scale);
    ctx.restore();
  }

  function drawFish(x, y, scale, facing) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing, 1);
    ctx.fillStyle = 'rgba(255,210,130,0.85)';
    ctx.beginPath();
    ctx.ellipse(0, 0, 10 * scale, 5 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-9 * scale, 0);
    ctx.lineTo(-16 * scale, -5 * scale);
    ctx.lineTo(-16 * scale, 5 * scale);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawIceShelf(horizonY) {
    ctx.fillStyle = '#f5fafc';
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 26);
    ctx.lineTo(0, horizonY);
    ctx.quadraticCurveTo(W * 0.15, horizonY - 10, W * 0.3, horizonY);
    ctx.quadraticCurveTo(W * 0.45, horizonY + 8, W * 0.6, horizonY - 4);
    ctx.quadraticCurveTo(W * 0.78, horizonY - 14, W, horizonY - 2);
    ctx.lineTo(W, horizonY + 26);
    ctx.closePath();
    ctx.fill();
  }

  function drawPenguin(x, y, swimBlend, flyBlend, t) {
    // swimBlend/flyBlend ramp smoothly from 0 to 1 near the walk boundary instead of
    // snapping instantly, so the ~80 degree swim tilt doesn't pop in right at the ice edge.
    const walkW = Math.max(0, 1 - swimBlend - flyBlend);
    const flyW = flyBlend, swimW = swimBlend;

    const walkStride = Math.sin(t * 5);
    const walkBob = Math.abs(Math.cos(t * 5)) * 3;
    const walkWingFlap = Math.sin(t * 5) * 0.15;
    const walkWingRest = 0.35;

    const flyFlapSpeed = 8 + turbulence * 4;
    const flyWingFlap = Math.sin(t * flyFlapSpeed) * 0.8;
    const flyBob = Math.sin(t * flyFlapSpeed) * 5;
    const flyDriftX = Math.sin(t * 0.7) * 22;
    const flyTilt = -0.35 + Math.sin(t * flyFlapSpeed * 0.5) * 0.06;
    const flyFacing = Math.cos(t * 0.7) >= 0 ? 1 : -1;

    const swimFlapSpeed = 4 + turbulence * 2.5;
    const swimWingFlap = Math.sin(t * swimFlapSpeed) * 0.9;
    const swimBob = Math.sin(t * swimFlapSpeed * 0.6) * 6;
    const swimDriftX = Math.sin(t * 0.9) * 16;
    const swimTilt = -1.4 + Math.sin(t * swimFlapSpeed * 0.6) * 0.1;
    const swimFacing = Math.cos(t * 0.9) >= 0 ? 1 : -1;

    const stride = walkW * walkStride;
    const bob = walkW * walkBob + flyW * flyBob + swimW * swimBob;
    const wingFlap = walkW * walkWingFlap + flyW * flyWingFlap + swimW * swimWingFlap;
    const wingRest = walkW * walkWingRest + flyW * 1.0 + swimW * 0.6;
    const driftX = flyW * flyDriftX + swimW * swimDriftX;
    const tilt = flyW * flyTilt + swimW * swimTilt;
    const facing = flyW * flyFacing + swimW * swimFacing + walkW * 1;

    ctx.save();
    ctx.translate(x + driftX, y);
    ctx.scale(1.25 * facing, 1.25);
    ctx.translate(0, -36); // re-anchor to the feet, not the torso center
    ctx.rotate(tilt + smoothBias * 0.04);
    ctx.translate(0, -bob);

    // soft grounded shadow (claymation sits heavy) - fades out smoothly once airborne/swimming
    const shadowAlpha = 0.08 + walkW * 0.14;
    ctx.fillStyle = `rgba(0,0,0,${shadowAlpha})`;
    ctx.beginPath();
    ctx.ellipse(-2, 36, 18, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // small tail stub poking out the back
    ctx.fillStyle = '#181e26';
    ctx.beginPath();
    ctx.moveTo(-14, 28);
    ctx.lineTo(-24, 33);
    ctx.lineTo(-13, 20);
    ctx.closePath();
    ctx.fill();

    // main body+head silhouette, side-on: rounded back, chest bulge at front, head leaning forward
    ctx.fillStyle = '#181e26';
    ctx.beginPath();
    ctx.moveTo(-14, 34);
    ctx.bezierCurveTo(-21, 28, -21, -2, -14, -18);
    ctx.bezierCurveTo(-10, -30, 0, -36, 9, -34);
    ctx.bezierCurveTo(15, -32, 17, -25, 14, -19);
    ctx.bezierCurveTo(21, -12, 21, 12, 16, 25);
    ctx.bezierCurveTo(13, 33, 5, 36, -3, 36);
    ctx.bezierCurveTo(-8, 36, -12, 35, -14, 34);
    ctx.closePath();
    ctx.fill();

    // soft clay highlight
    const sheen = ctx.createRadialGradient(-6, -20, 2, -6, -20, 28);
    sheen.addColorStop(0, 'rgba(255,255,255,0.10)');
    sheen.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    ctx.beginPath();
    ctx.ellipse(0, 0, 22, 38, 0, 0, Math.PI * 2);
    ctx.fill();

    // thin yellow flank stripe along the chest edge, where black meets white
    ctx.fillStyle = '#f2c94c';
    ctx.beginPath();
    ctx.ellipse(-2, 10, 3, 20, 0.15, 0, Math.PI * 2);
    ctx.fill();

    // belly - white patch along the front (chest) side
    ctx.fillStyle = '#f4f7f9';
    ctx.beginPath();
    ctx.moveTo(3, -8);
    ctx.bezierCurveTo(11, -4, 12, 12, 10, 24);
    ctx.bezierCurveTo(8, 31, 1, 34, -5, 32);
    ctx.bezierCurveTo(-3, 20, -3, 2, 3, -8);
    ctx.closePath();
    ctx.fill();

    // legs fade out smoothly as flyBlend approaches 1, instead of popping off instantly
    const legAlpha = 1 - flyW;
    if (legAlpha > 0.02) {
      ctx.globalAlpha = legAlpha;
      const backX = -6 - stride * 7, backLift = Math.max(0, -stride) * 5;
      ctx.fillStyle = '#f0972a';
      ctx.beginPath();
      ctx.ellipse(backX - 6, 36 - backLift, 9, 4.5, 0.1, 0, Math.PI * 2);
      ctx.fill();

      const frontX = 4 + stride * 7, frontLift = Math.max(0, stride) * 5;
      ctx.beginPath();
      ctx.ellipse(frontX + 6, 36 - frontLift, 9, 4.5, -0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // flipper - hangs near the body walking, sweeps up/back flying, strokes like a wing swimming
    // drawn after the body so it's visible as a limb, not painted over by the torso fill
    ctx.save();
    ctx.translate(-2, -6);
    ctx.rotate(-wingRest - wingFlap);
    ctx.fillStyle = '#12161c';
    ctx.beginPath();
    ctx.ellipse(0, 14, 6, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,140,160,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // eye - single, profile-facing forward, big white with black pupil
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(9, -27, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a0c0f';
    ctx.beginPath();
    ctx.arc(10.5, -26, 2.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(11.5, -27.5, 0.7, 0, Math.PI * 2);
    ctx.fill();

    // beak - profile wedge pointing forward
    ctx.fillStyle = '#e8432a';
    ctx.beginPath();
    ctx.moveTo(13, -24);
    ctx.lineTo(25, -19);
    ctx.lineTo(13, -15);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // bubbles trailing from swimming - fade in with swimBlend, more/bigger when turbulent
    if (Math.random() < swimW * (0.3 + turbulence * 0.3)) {
      penguinBubbles.push({
        x: x + driftX + (Math.random() - 0.5) * 20, y: y + 20,
        r: 1 + Math.random() * (2 + turbulence), alpha: 0.6
      });
    }
  }

  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const t = now * 0.001;

    smoothMmol += (rawMmol - smoothMmol) * 0.01;
    smoothBias += (trendBias - smoothBias) * 0.02;

    const horizonY = H * GROUND_FRAC;
    const yFrac = yFracForMmol(smoothMmol);
    const penguinY = yFrac * H;

    // smooth 0-1 blends instead of a hard walk/fly/swim switch, so the ~80deg swim tilt
    // and the wing-spread fly pose ease in over a small band instead of snapping at the edge
    const TRANSITION = 0.05;
    const swimBlend = Math.max(0, Math.min(1, (yFrac - GROUND_FRAC) / TRANSITION));
    const flyBlend = Math.max(0, Math.min(1, (GROUND_FRAC - yFrac) / TRANSITION));
    const walkWeight = Math.max(0, 1 - swimBlend - flyBlend);

    // backdrop scrolls past to sell forward motion - fastest on foot, slower drifting in air/water
    const scrollSpeed = walkWeight * 0.09 + swimBlend * 0.035 + flyBlend * 0.015;

    // sky - pale Pingu-style powder blue, brightening toward the horizon
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, '#7ec4ec');
    skyGrad.addColorStop(1, '#eaf6fb');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, horizonY + 1);

    icebergs.forEach(b => {
      b.x = (b.x + b.speed * dt - scrollSpeed * dt + 1.3) % 1.3;
      drawIceberg((b.x - 0.15) * W, horizonY + 4, b.scale, b.jag);
    });

    // ocean - icy teal rather than deep navy, to stay in the pastel palette
    const seaGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    seaGrad.addColorStop(0, '#3ea8c4');
    seaGrad.addColorStop(1, '#0a3550');
    ctx.fillStyle = seaGrad;
    ctx.fillRect(0, horizonY, W, H - horizonY);

    fish.forEach(f => {
      f.x += (f.speed * dt) / 3;
      if (f.x > 1.1) f.x = -0.1; if (f.x < -0.1) f.x = 1.1;
      drawFish(f.x * W, horizonY + (f.y - GROUND_FRAC) / (1 - GROUND_FRAC) * (H - horizonY) * 0.4 + (H - horizonY) * 0.15, f.scale, f.speed > 0 ? 1 : -1);
    });

    if (Math.random() < 0.03) {
      ambientBubbles.push({ x: Math.random() * W, y: H - 4, r: 1 + Math.random() * 2, alpha: 0.5 });
    }
    ambientBubbles.forEach(b => { b.y -= 18 * dt; b.alpha -= 0.15 * dt; });
    ambientBubbles = ambientBubbles.filter(b => b.alpha > 0 && b.y > horizonY);
    penguinBubbles.forEach(b => { b.y -= 26 * dt; b.alpha -= 0.4 * dt; b.x += Math.sin(b.y * 0.1) * 0.2; });
    penguinBubbles = penguinBubbles.filter(b => b.alpha > 0 && b.y > horizonY);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    [...ambientBubbles, ...penguinBubbles].forEach(b => {
      ctx.globalAlpha = Math.max(0, b.alpha);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // ice shelf horizon
    drawIceShelf(horizonY);

    // igloo sits on top of the shelf, drawn after it so it doesn't get painted over
    // scrolls with the same speed as the icebergs, wrapping around like they do
    iglooX = (iglooX - scrollSpeed * dt + 1.3) % 1.3;
    drawIgloo((iglooX - 0.15) * W, horizonY - 6, 1.2);

    // penguin
    drawPenguin(W * 0.42, penguinY, swimBlend, flyBlend, t);

    // gentle drifting snow, in front of everything for a light foreground dusting
    snow.forEach(s => {
      s.y += s.speed * dt;
      s.x += s.drift * dt;
      if (s.y > 1) { s.y = -0.02; s.x = Math.random(); }
    });
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    snow.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
